name: 新澳门彩每日自动更新与推送

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install xgboost scikit-learn pandas

      - name: 下载上次运行的数据库（如果存在）
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: push.yml
          name: newmacau-db
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: 确保数据库存在（如果下载失败就用源数据库兜底）
        run: |
          if [ -f "newmacau_marksix.db" ]; then
            echo "数据库已就绪"
          else
            echo "数据库缺失，尝试使用仓库中的备份数据库"
            cp newmacau_marksix_backup.db newmacau_marksix.db || true
          fi

      - name: 同步最新开奖并生成预测
        run: python newmacau_marksix.py sync --with-backtest

      - name: 显示结果并推送
        run: python newmacau_marksix.py show

      - name: 上传数据库（供下次使用）
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7