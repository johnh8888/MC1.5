name: 澳门彩全自动预测

on:
  schedule:
    - cron: '30 0 * * *'   # 每天北京时间 08:30
  workflow_dispatch:        # 允许手动触发

jobs:
  auto-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11（兼容最新 scikit-learn）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 升级 pip 并安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 同步数据并预测（使用已有最优参数）
        run: python newmacau_marksix.py sync --with-backtest

      - name: 生成推荐报告
        run: python newmacau_marksix.py show > report.txt

      - name: 提交结果到仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newmacau_marksix.db best_params_zodiac.json report.txt
          git commit -m "自动预测报告 $(date +'%Y-%m-%d')" || echo "无变化"
          git push

      - name: 发送微信通知（需要配置 Secrets.PUSHPLUS_TOKEN）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        if: env.PUSHPLUS_TOKEN != ''
        run: |
          python -c "
          import urllib.request, json
          token = '${{ secrets.PUSHPLUS_TOKEN }}'
          with open('report.txt', 'r', encoding='utf-8') as f:
              content = f.read()[-2000:]   # 取最后2000字符
          data = {'token': token, 'title': '澳门彩预测', 'content': content, 'template': 'txt'}
          req = urllib.request.Request('https://www.pushplus.plus/send', data=json.dumps(data).encode(), headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req).read()
          "
