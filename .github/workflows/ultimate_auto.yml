name: 澳门彩全自动预测

on:
  schedule:
    # 每天 UTC 时间 00:30 运行（北京时间 08:30）
    - cron: '30 0 * * *'
  workflow_dispatch:   # 允许手动触发

jobs:
  auto-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # 额外安装 optuna（如果未在 requirements 中）
          pip install optuna

      - name: 运行全自动优化（可选，耗时较长）
        # 如果想每次重新优化，取消下面注释；否则使用现有参数。
        # run: python newmacau_marksix.py auto-optimize --n-trials 100
        run: echo "跳过优化，使用已有 best_params_zodiac.json"

      - name: 同步数据并预测
        run: python newmacau_marksix.py sync --with-backtest

      - name: 生成推荐报告
        run: python newmacau_marksix.py show > report.txt

      - name: 提交结果到仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newmacau_marksix.db best_params_zodiac.json report.txt
          git commit -m "自动预测报告 $(date +'%Y-%m-%d')" || echo "无变化"
          git push
