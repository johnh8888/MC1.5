name: 增量进化生肖命中率

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # 每6小时运行一次

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install optuna numpy
      - name: 缓存数据
        uses: actions/cache@v4
        with:
          path: |
            newmacau_marksix.db
            optuna_study.db
          key: marksix-cache-${{ hashFiles('newmacau_marksix.db') }}
          restore-keys: marksix-cache-
      - name: 同步最新开奖
        run: python newmacau_marksix.py sync
      - name: 运行优化器 (续传)
        run: python hyper_optimize_ultimate.py --trials 200
      - name: 重建回测与报告
        run: |
          python newmacau_marksix.py backfill-special
          python newmacau_marksix.py backtest --rebuild
          python newmacau_marksix.py show | tee report.txt
      - name: 提交进度
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json optuna_study.db report.txt || true
          git commit -m "优化进度更新 [skip ci]" || echo "No changes"
          git push