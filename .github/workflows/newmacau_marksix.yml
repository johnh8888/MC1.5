name: 新澳门1.5每日自动更新与推送

on:
  schedule:
    # 每天 UTC 14:00（北京时间 22:00），可根据实际开奖时间调整
    - cron: '0 14 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  update-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install xgboost scikit-learn numpy

      - name: 配置 PushPlus Token
        run: echo "PUSHPLUS_TOKEN=${{ secrets.PUSHPLUS_TOKEN }}" >> $GITHUB_ENV

      - name: 初始化数据库（如果不存在）
        run: |
          if [ ! -f "newmacau_marksix.db" ]; then
            echo "数据库不存在，开始初始化..."
            python newmacau_marksix.py bootstrap
          fi

      - name: 同步最新开奖并生成预测
        run: |
          echo "同步最新数据..."
          python newmacau_marksix.py sync --with-backtest --api-timeout 30 --api-retries 6

      - name: 强制重训 XGB 模型并显示结果
        run: |
          echo "重训 XGBoost 模型..."
          python newmacau_marksix.py --retrain show

      - name: 上传数据库（备份）
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7
