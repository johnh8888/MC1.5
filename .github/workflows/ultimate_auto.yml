name: 澳门彩全自动进化

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # 每4小时

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # 5.5小时，确保在平台限制前正常结束
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install optuna numpy tensorflow hmmlearn
          pip install -r requirements.txt || true

      - name: 缓存
        uses: actions/cache@v4
        with:
          path: |
            newmacau_marksix.db
            optuna_macau_target.db
            lstm_zodiac.h5
            lstm_seq_len.txt
            hmm_zodiac.pkl
          key: macau-cache-${{ hashFiles('newmacau_marksix.db') }}
          restore-keys: macau-cache-

      - name: 同步最新开奖
        run: python newmacau_marksix.py sync

      - name: 训练/更新 LSTM 模型
        run: |
          if [ -f best_params_zodiac.json ]; then
            CURRENT_SEQ=$(python -c "import json; p=json.load(open('best_params_zodiac.json')); print(p.get('lstm_seq_len',30))")
          else CURRENT_SEQ=30; fi
          LAST_SEQ=$(cat lstm_seq_len.txt 2>/dev/null || echo 0)
          if [ "$CURRENT_SEQ" != "$LAST_SEQ" ] || [ ! -f lstm_zodiac.h5 ]; then
            python lstm_predictor.py --db newmacau_marksix.db --seq_len $CURRENT_SEQ --epochs 30
            echo $CURRENT_SEQ > lstm_seq_len.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lstm_zodiac.h5 lstm_seq_len.txt || true
            git commit -m "更新 LSTM 模型 [skip ci]" || true
            git push || true
          fi

      - name: 训练/更新 HMM 模型
        run: |
          if [ ! -f hmm_zodiac.pkl ] || [ $(find hmm_zodiac.pkl -mmin +1440) ]; then
            python hmm_features.py --db newmacau_marksix.db
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add hmm_zodiac.pkl || true
            git commit -m "更新 HMM 模型 [skip ci]" || true
            git push || true
          fi

      - name: 长时优化（使用目标优化器）
        shell: bash
        run: |
          set +e
          for i in {1..500}; do
            echo "====== 第 $i 轮优化 ======"
            python hyper_optimize_ultimate_target.py --trials 1000
            STATUS=$?
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add best_params_zodiac.json optuna_macau_target.db 2>/dev/null
            git commit -m "自动优化第${i}轮 [skip ci]" 2>/dev/null
            git push 2>/dev/null
            if [ $STATUS -eq 0 ]; then
              echo "🎉 已达目标，停止优化！"
              break
            fi
            sleep 3
          done

      - name: 重建回测与报告
        if: always()
        run: |
          python newmacau_marksix.py backfill-special
          python newmacau_marksix.py backtest --rebuild
          python newmacau_marksix.py show | tee report.txt

      - name: 提交结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json optuna_macau_target.db report.txt newmacau_marksix.db lstm_zodiac.h5 lstm_seq_len.txt hmm_zodiac.pkl 2>/dev/null
          git commit -m "澳门彩进化结果 [skip ci]" 2>/dev/null
          git push 2>/dev/null
