name: 新澳门彩每日自动更新与推送

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-predict:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install xgboost scikit-learn numpy pandas lightgbm

      - name: 下载上次运行的数据库
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: push.yml
          name: newmacau-db
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: 初始化数据库（如果不存在，则拉取最近100期）
        run: |
          if [ ! -f "newmacau_marksix.db" ]; then
            echo "数据库不存在，拉取最近100期数据..."
            python newmacau_marksix.py recent --limit 100
          fi

      - name: 同步最新开奖并生成预测
        run: python newmacau_marksix.py sync --with-backtest

      - name: 回溯精选特别号历史日志
        run: python newmacau_marksix.py backfill-special

      - name: 显示最终推荐并自动推送
        run: python newmacau_marksix.py show

      - name: 上传数据库
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7