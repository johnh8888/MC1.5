name: 澳门彩全自动预测

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  auto-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 关键：允许推送代码
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install optuna

      - name: 同步并预测
        run: python newmacau_marksix.py sync --with-backtest

      - name: 生成报告
        run: python newmacau_marksix.py show > report.txt

      - name: 提交结果
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newmacau_marksix.db best_params_zodiac.json report.txt
          git commit -m "自动预测报告 $(date +'%Y-%m-%d')" || echo "无变化"
          git push
