name: 澳门彩全自动进化 (120期+全策略搜索)

on:
  schedule:
    - cron: '0 */5 * * *'   # 每6小时自动执行
  workflow_dispatch:         # 允许手动触发

jobs:
  auto-evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 200     # 预留充足时间给5000次试验+回测
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install optuna numpy hmmlearn xgboost lightgbm tensorflow
          pip install -r requirements.txt || true

      - name: 全自动重置 + 获取最新120期 + 策略优化5000次
        run: |
          python newmacau_marksix.py reset-and-auto --trials 5000 2>&1 | tee report.txt

      - name: 提交结果（数据库、最佳参数、报告）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f newmacau_marksix.db best_params_zodiac.json optuna_macau_stable.db report.txt 2>/dev/null || true
          git commit -m "自动优化结果 [skip ci]" || true
          git push || true
