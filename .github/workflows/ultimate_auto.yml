name: 澳门彩全自动（优化＋预测）

on:
  schedule:
    # 每周一 02:00 UTC = 北京时间 10:00 运行优化（避开高峰）
    - cron: '0 2 * * 1'
  workflow_dispatch:          # 手动触发

jobs:
  auto-optimize-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: 全自动优化（达到命中率≥90% 最大连空≤1）
        run: python newmacau_marksix.py auto-optimize --n-trials 200
      - name: 提交最佳参数
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json newmacau_marksix.db
          git commit -m "每周自动优化 $(date +'%Y-%m-%d')" || echo "无变化"
          git push

  daily-predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 每天运行（除周一已运行优化外，其余天用现有参数预测）
    if: github.event_name == 'schedule' && github.event.schedule != '0 2 * * 1'
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 同步最新数据并预测
        run: python newmacau_marksix.py sync --with-backtest
      - name: 生成推荐报告
        run: python newmacau_marksix.py show > report.txt
      - name: 提交数据库和报告
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newmacau_marksix.db report.txt
          git commit -m "每日预测报告 $(date +'%Y-%m-%d')" || echo "无变化"
          git push
      - name: 上传报告作为 artifact（便于直接查看）
        uses: actions/upload-artifact@v4
        with:
          name: prediction-report
          path: report.txt
      - name: 微信推送（可选）
        if: env.PUSHPLUS_TOKEN != ''
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          content=$(tail -40 report.txt | sed 's/"/\\"/g')
          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"澳门彩预测\",\"content\":\"$content\",\"template\":\"txt\"}"
