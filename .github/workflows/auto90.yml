name: 全自动优化至90%命中率（硬指标版本）
on:
  workflow_dispatch:          # 允许手动触发
  schedule:
    - cron: '0 5 * * *'       # 每天UTC 05:00自动运行（北京时间13:00）

jobs:
  auto90:
    runs-on: ubuntu-latest
    timeout-minutes: 360      # 最多运行6小时
    # 必须赋予写入权限，否则无法推送代码
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖（含xgboost、optuna等）
        run: |
          pip install --upgrade pip
          pip install optuna numpy
          pip install -r requirements.txt || true

      - name: 缓存数据库（加速后续运行）
        uses: actions/cache@v4
        with:
          path: newmacau_marksix.db
          key: marksix-db-${{ github.run_id }}
          restore-keys: marksix-db-

      - name: 同步最新开奖数据
        run: python newmacau_marksix.py sync

      - name: 运行硬指标超参数优化器
        run: python hyper_optimize_hard_target_v2.py --trials 500

      - name: 使用新参数重建回测与特别号记录
        run: |
          python newmacau_marksix.py backfill-special
          python newmacau_marksix.py backtest --rebuild

      - name: 生成最终推荐报告
        run: python newmacau_marksix.py show | tee report.txt

      - name: 提交优化结果及报告
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json newmacau_marksix.db report.txt || true
          git commit -m "自动优化至90%命中率 [skip ci]" || echo "没有新更改，跳过提交"
          git push
