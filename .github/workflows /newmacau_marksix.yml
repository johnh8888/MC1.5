name: 新澳门彩每日自动更新与推送

on:
  schedule:
    - cron: '0 14 * * *'      # 北京时间 22:00
  workflow_dispatch:

jobs:
  update-predict:
    runs-on: ubuntu-latest
    env:
      PREDICT_LAG: 1           # 全局预测前移一期
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下载上次运行的数据库
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: push.yml        # 需与上传的工作流名称一致
          name: newmacau-db
          path: .
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: 初始化数据库（如不存在，拉取最近100期）
        run: |
          if [ ! -f "newmacau_marksix.db" ]; then
            echo "数据库不存在，拉取最近100期数据..."
            python newmacau_marksix.py recent --limit 100
          fi

      - name: 同步最新开奖并生成预测
        run: python newmacau_marksix.py sync --with-backtest

      - name: 回溯精选特别号历史日志
        run: python newmacau_marksix.py backfill-special

      - name: 临时诊断：查看精选特别号命中详情
        run: |
          python -c "
          import sqlite3, json
          from newmacau_marksix import *

          conn = connect_db('newmacau_marksix.db')
          init_db(conn)

          recent = [r['issue_no'] for r in conn.execute('SELECT issue_no FROM draws ORDER BY draw_date DESC LIMIT 20').fetchall()]
          print('期号 | 实际特号(生肖) | 精选号 | 命中')
          print('-'*80)
          for issue in recent:
              row = conn.execute('SELECT special_number FROM draws WHERE issue_no=?', (issue,)).fetchone()
              actual = row['special_number']
              picks = conn.execute('SELECT picks_json FROM special_picks_log WHERE issue_no=?', (issue,)).fetchone()
              picks_list = json.loads(picks['picks_json']) if picks else []
              hit = 'Yes' if actual in picks_list else 'No'
              zodiac = get_zodiac_by_number(actual)
              print(f'{issue} | {actual}({zodiac}) | {picks_list} | {hit}')
          conn.close()
          "

      - name: 显示最终推荐并自动推送
        run: python newmacau_marksix.py show

      - name: 上传数据库
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7
