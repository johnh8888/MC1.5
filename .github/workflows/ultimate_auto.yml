name: 澳门彩全自动优化（达标为止）

on:
  schedule:
    # 每天 UTC 00:30 运行（北京时间 08:30）
    - cron: '30 0 * * *'
  workflow_dispatch:    # 支持手动触发

jobs:
  continuous-optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install optuna

      - name: 运行全自动优化（300次试验）
        run: python newmacau_marksix.py auto-optimize --n-trials 300

      - name: 提取并判断是否达标
        id: check
        run: |
          python << 'EOF'
          import re, json, os
          # 读取最后输出的表现（可以从 report.txt 或直接解析控制台输出）
          # 这里我们自动调用一次 show 来获取最新表现
          os.system('python newmacau_marksix.py show > report.txt')
          with open('report.txt', 'r', encoding='utf-8') as f:
              text = f.read()
          # 正则提取
          single = re.search(r'一生肖近10期命中率:\s*([0-9.]+)%', text)
          two = re.search(r'二生肖近10期命中率:\s*([0-9.]+)%', text)
          three = re.search(r'三生肖近10期命中率:\s*([0-9.]+)%', text)
          special = re.search(r'特别生肖近10期命中率:\s*([0-9.]+)%', text)
          miss_s = re.search(r'一生肖.*连空(\d+)', text)
          miss_t = re.search(r'二生肖.*连空(\d+)', text)
          miss_th = re.search(r'三生肖.*连空(\d+)', text)
          miss_sp = re.search(r'特别生肖.*连空(\d+)', text)

          hit = {
              'single': float(single.group(1))/100 if single else 0,
              'two': float(two.group(1))/100 if two else 0,
              'three': float(three.group(1))/100 if three else 0,
              'special': float(special.group(1))/100 if special else 0,
          }
          miss = {
              'single': int(miss_s.group(1)) if miss_s else 10,
              'two': int(miss_t.group(1)) if miss_t else 10,
              'three': int(miss_th.group(1)) if miss_th else 10,
              'special': int(miss_sp.group(1)) if miss_sp else 10,
          }
          achieved = (hit['single'] >= 0.9 and miss['single'] <= 1 and
                      hit['two'] >= 0.9 and miss['two'] <= 1 and
                      hit['three'] >= 0.9 and miss['three'] <= 1 and
                      hit['special'] >= 0.9 and miss['special'] <= 1)
          # 设置输出
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"achieved={str(achieved).lower()}\n")
          # 保存命中率以便后续显示
          with open('hit_rates.json', 'w') as f:
              json.dump({'hit': hit, 'miss': miss, 'achieved': achieved}, f)
          EOF

      - name: 提交最佳参数（如果达标）
        if: steps.check.outputs.achieved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json newmacau_marksix.db report.txt
          git commit -m "🎉 达标：命中率≥90% 连空≤1 $(date +'%Y-%m-%d')" || echo "无变化"
          git push

      - name: 上传优化报告（无论是否达标）
        uses: actions/upload-artifact@v4
        with:
          name: optimization-report
          path: report.txt

      - name: 微信推送通知（可选，需配置 PUSHPLUS_TOKEN）
        if: env.PUSHPLUS_TOKEN != ''
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          ACHIEVED: ${{ steps.check.outputs.achieved }}
        run: |
          content="澳门彩优化结果：$(cat report.txt | tail -10)"
          curl -X POST https://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$PUSHPLUS_TOKEN\",\"title\":\"澳门彩优化${ACHIEVED:+达标✨}\",\"content\":\"$content\",\"template\":\"txt\"}"
