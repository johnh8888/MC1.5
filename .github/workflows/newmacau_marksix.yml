name: 新澳门彩每日自动更新与推送

on:
  schedule:
    - cron: '0 14 * * *'      # 北京时间 22:00
  workflow_dispatch:

jobs:
  update-predict:
    runs-on: ubuntu-latest
    env:
      PREDICT_LAG: 1
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 删除旧数据库（强制全新同步）
        run: rm -f newmacau_marksix.db
        continue-on-error: true

      - name: 同步最新开奖（拉取最近200期）
        run: python newmacau_marksix.py sync --with-backtest

      - name: 回溯精选特别号历史日志
        run: python newmacau_marksix.py backfill-special

      - name: 显示最终推荐并推送
        run: python newmacau_marksix.py show

      - name: 上传数据库
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7