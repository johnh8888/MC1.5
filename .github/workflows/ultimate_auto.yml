name: 全自动进化至90%（连续多轮，修正版）

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install optuna numpy

      - name: 缓存数据库
        uses: actions/cache@v4
        with:
          path: |
            newmacau_marksix.db
            optuna_study.db
          key: marksix-cache-${{ hashFiles('newmacau_marksix.db') }}
          restore-keys: marksix-cache-

      - name: 同步最新开奖数据
        run: python newmacau_marksix.py sync

      - name: 多轮连续优化直至达标
        shell: bash
        run: |
          set +e   # 允许单条命令失败不终止循环
          for i in {1..50}; do
            echo "====== 第 $i 轮优化 ======"
            python hyper_optimize_ultimate.py --trials 200
            STATUS=$?
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add best_params_zodiac.json optuna_study.db || true
            git commit -m "自动优化第${i}轮进度 [skip ci]" || true
            git push || true
            if [ $STATUS -eq 0 ]; then
              echo "🎉 已达目标，停止优化！"
              break
            fi
            sleep 5
          done

      - name: 使用最佳参数重建回测与报告
        if: always()
        run: |
          python newmacau_marksix.py backfill-special
          python newmacau_marksix.py backtest --rebuild
          python newmacau_marksix.py show | tee report.txt

      - name: 提交最终结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add best_params_zodiac.json optuna_study.db report.txt newmacau_marksix.db || true
          git commit -m "最终优化结果 [skip ci]" || true
          git push