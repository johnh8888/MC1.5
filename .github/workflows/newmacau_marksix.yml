name: 新澳门彩每日自动更新与推送

on:
  schedule:
    - cr00
  workflow_dispatch:

jobs:
  update-predict:
    runs-on: ubuntu-latest
    env:
      PREDICT_LAG: 1
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行完整预测（自动同步、回溯、推荐、推送）
        run: python newmacau_marksix.py show

      - name: 上传数据库（可选）
        uses: actions/upload-artifact@v4
        with:
          name: newmacau-db
          path: newmacau_marksix.db
          retention-days: 7
